<!doctype html>
<html lang="hu" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}stremhu debrid sidecar{% endblock %}</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<script src="https://cdn.tailwindcss.com"></script>
{% if running %}<meta http-equiv="refresh" content="3">{% endif %}
</head>
<body class="h-full bg-slate-950 text-slate-200 antialiased">
<div class="mx-auto max-w-4xl px-4 py-8">
  <header class="mb-8 border-b border-slate-800 pb-4">
    <a href="/" class="inline-flex items-center gap-3 text-lg font-semibold tracking-tight text-slate-100">
      <img src="/static/mark.png" alt="" width="36" height="36" class="h-9 w-9 rounded-md">
      <span>stremhu <span class="text-slate-500">debrid sidecar</span></span>
    </a>
    <nav class="mt-4 flex gap-1 text-sm">
      {% set nav = [('/', 'Áttekintés'), ('/sync', 'Debridbe szinkronizálás'), ('/share', 'Megosztás')] %}
      {% for href, label in nav %}
        <a href="{{ href }}" class="rounded-md px-3 py-1.5
          {% if page == href %}bg-slate-800 text-slate-100{% else %}text-slate-400 hover:text-slate-100{% endif %}">
          {{ label }}
        </a>
      {% endfor %}
    </nav>
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
