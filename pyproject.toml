[project]
name = "stremhu-debrid-sidecar"
version = "0.2.1"
description = "Push what you watched in stremhu into your debrid cache, and share the hashes with others"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "apscheduler==3.11.3",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7", "lzstring==1.0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["BLE001"]
